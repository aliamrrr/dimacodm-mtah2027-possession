<text font-family="'Times New Roman', Times, serif" x="522" y="92" font-size="12.5" fill="#111111" text-anchor="start" font-style="normal" font-weight="normal">stoppage</text>
<text font-family="'Times New Roman', Times, serif" x="790" y="92" font-size="12.5" fill="#111111" text-anchor="end" font-style="normal" font-weight="normal">5</text>
