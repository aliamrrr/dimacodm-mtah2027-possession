<text font-family="'Times New Roman', Times, serif" x="110" y="209.5" font-size="13" fill="#ffffff" text-anchor="middle" font-style="normal" font-weight="bold">A</text>
<circle cx="350.0" cy="85.0" r="22" fill="#8a8f98" stroke="none" stroke-width="0.0"/>
