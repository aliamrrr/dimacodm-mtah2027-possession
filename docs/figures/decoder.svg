</defs>
<rect x="0" y="0" width="830" height="284" fill="#ffffff"/>
<text font-family="'Times New Roman', Times, serif" x="229.0" y="23" font-size="15.6" fill="#111111" text-anchor="middle" font-style="italic" font-weight="normal">(a) States and allowed moves</text>
