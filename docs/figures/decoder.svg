<text font-family="'Times New Roman', Times, serif" x="522" y="116" font-size="12.5" fill="#111111" text-anchor="start" font-style="normal" font-weight="normal">restart by the other team</text>
<text font-family="'Times New Roman', Times, serif" x="790" y="116" font-size="12.5" fill="#111111" text-anchor="end" font-style="normal" font-weight="normal">30</text>
<line x1="482" y1="136" x2="512" y2="136" stroke="#111111" stroke-width="1.0" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text font-family="'Times New Roman', Times, serif" x="522" y="140" font-size="12.5" fill="#111111" text-anchor="start" font-style="normal" font-weight="normal">restart by the same team</text>
<text font-family="'Times New Roman', Times, serif" x="790" y="140" font-size="12.5" fill="#111111" text-anchor="end" font-style="normal" font-weight="normal">31</text>
<line x1="478" y1="150" x2="794" y2="150" stroke="#444444" stroke-width="1.0"/>
<text font-family="'Times New Roman', Times, serif" x="478" y="170" font-size="11" fill="#666666" text-anchor="start" font-style="normal" font-weight="normal">Staying in a state is free.</text>
<text font-family="'Times New Roman', Times, serif" x="478" y="186" font-size="11" fill="#666666" text-anchor="start" font-style="normal" font-weight="normal">A restart is cheaper while the players accelerate.</text>
<text font-family="'Times New Roman', Times, serif" x="478" y="202" font-size="11" fill="#666666" text-anchor="start" font-style="normal" font-weight="normal">A change of team is cheaper where the model detects one.</text>
<text font-family="'Times New Roman', Times, serif" x="478" y="218" font-size="11" fill="#666666" text-anchor="start" font-style="normal" font-weight="normal">Costs searched on held-out games, never on the provided match.</text>
