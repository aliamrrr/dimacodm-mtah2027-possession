<text font-family="'Times New Roman', Times, serif" x="235.0" y="245" font-size="13.2" fill="#555555" text-anchor="middle" font-style="italic" font-weight="normal">stoppage</text>
<line x1="328" y1="114" x2="145" y2="200" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="328" y1="202" x2="145" y2="116" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<rect x="265.0" y="148.0" width="70" height="18" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text font-family="'Times New Roman', Times, serif" x="300.0" y="161.0" font-size="13.2" fill="#555555" text-anchor="middle" font-style="italic" font-weight="normal">restart</text>
<circle cx="120.0" cy="96.0" r="24" fill="#1f4e9c" stroke="none" stroke-width="0.0"/>
<text font-family="'Times New Roman', Times, serif" x="120" y="100.5" font-size="15.6" fill="#ffffff" text-anchor="middle" font-style="normal" font-weight="bold">H</text>
<circle cx="120.0" cy="220.0" r="24" fill="#d9651e" stroke="none" stroke-width="0.0"/>
<text font-family="'Times New Roman', Times, serif" x="120" y="224.5" font-size="15.6" fill="#ffffff" text-anchor="middle" font-style="normal" font-weight="bold">A</text>
<circle cx="350.0" cy="96.0" r="24" fill="#8a8f98" stroke="none" stroke-width="0.0"/>
<text font-family="'Times New Roman', Times, serif" x="350" y="100.5" font-size="15.6" fill="#ffffff" text-anchor="middle" font-style="normal" font-weight="bold">D|H</text>
<circle cx="350.0" cy="220.0" r="24" fill="#8a8f98" stroke="none" stroke-width="0.0"/>
<text font-family="'Times New Roman', Times, serif" x="350" y="224.5" font-size="15.6" fill="#ffffff" text-anchor="middle" font-style="normal" font-weight="bold">D|A</text>
<text font-family="'Times New Roman', Times, serif" x="350" y="62" font-size="13.2" fill="#555555" text-anchor="middle" font-style="normal" font-weight="normal">dead ball, home had it</text>
<text font-family="'Times New Roman', Times, serif" x="350" y="263" font-size="13.2" fill="#555555" text-anchor="middle" font-style="normal" font-weight="normal">dead ball, away had it</text>
<line x1="478" y1="56" x2="804" y2="56" stroke="#444444" stroke-width="1.0"/>
<line x1="482" y1="72" x2="512" y2="72" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<text font-family="'Times New Roman', Times, serif" x="522" y="76" font-size="15.0" fill="#111111" text-anchor="start" font-style="normal" font-weight="normal">change of team</text>
<text font-family="'Times New Roman', Times, serif" x="800" y="76" font-size="15.0" fill="#111111" text-anchor="end" font-style="normal" font-weight="normal">5</text>
<line x1="482" y1="100" x2="512" y2="100" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<text font-family="'Times New Roman', Times, serif" x="522" y="104" font-size="15.0" fill="#111111" text-anchor="start" font-style="normal" font-weight="normal">stoppage</text>
<text font-family="'Times New Roman', Times, serif" x="800" y="104" font-size="15.0" fill="#111111" text-anchor="end" font-style="normal" font-weight="normal">5</text>
<line x1="482" y1="128" x2="512" y2="128" stroke="#111111" stroke-width="1.1" marker-end="url(#arrow)"/>
<text font-family="'Times New Roman', Times, serif" x="522" y="132" font-size="15.0" fill="#111111" text-anchor="start" font-style="normal" font-weight="normal">restart by the other team</text>
<text font-family="'Times New Roman', Times, serif" x="800" y="132" font-size="15.0" fill="#111111" text-anchor="end" font-style="normal" font-weight="normal">30</text>
<line x1="482" y1="156" x2="512" y2="156" stroke="#111111" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text font-family="'Times New Roman', Times, serif" x="522" y="160" font-size="15.0" fill="#111111" text-anchor="start" font-style="normal" font-weight="normal">restart by the same team</text>
<text font-family="'Times New Roman', Times, serif" x="800" y="160" font-size="15.0" fill="#111111" text-anchor="end" font-style="normal" font-weight="normal">31</text>
<line x1="478" y1="172" x2="804" y2="172" stroke="#444444" stroke-width="1.0"/>
<text font-family="'Times New Roman', Times, serif" x="478" y="196" font-size="13.2" fill="#555555" text-anchor="start" font-style="normal" font-weight="normal">Staying in a state is free.</text>
<text font-family="'Times New Roman', Times, serif" x="478" y="215" font-size="13.2" fill="#555555" text-anchor="start" font-style="normal" font-weight="normal">A restart is cheaper while the players accelerate.</text>
<text font-family="'Times New Roman', Times, serif" x="478" y="234" font-size="13.2" fill="#555555" text-anchor="start" font-style="normal" font-weight="normal">A change of team is cheaper where the model detects one.</text>
<text font-family="'Times New Roman', Times, serif" x="478" y="253" font-size="13.2" fill="#555555" text-anchor="start" font-style="normal" font-weight="normal">Costs are searched on held-out games only.</text>
</svg>
