[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mtah"
version = "0.1.0"
description = "Frame-level ball possession for More than a Hack 2027, Phase 1 (team DIMACodm)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Kept small on purpose: every dependency listed here has to be reinstalled identically by whoever
# regenerates the submission. Inference is numpy only. Exact versions are pinned in uv.lock.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Local visualisation tools (PNG timeline, annotated video clips). Never needed to submit.
viz = ["matplotlib>=3.8", "opencv-python-headless>=4.9"]

[project.scripts]
mtah = "mtah.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]
# Training of the `ali_deep` model only (on a GPU machine, on public data about other games):
# never needed to reproduce a submission, whose inference is numpy. `uv sync --group train`.
train = ["torch==2.14.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mtah"]

[tool.mtah]
# The EXACT team name of the registration form. It names the submitted file (<team>.csv) and the
# technical document (<team>.pdf or <team>.md).
team = "DIMACodm"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["vendor/official", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PL", "RUF", "C4", "PTH", "T20"]
ignore = [
    "PLR0913",  # many arguments: normal for a command line
    "PLR2004",  # "magic" constants: normal in data analysis
    "PLR0912", "PLR0915", "PLR0911",
    "PLC0415",  # local imports: on purpose, to keep the command line fast and extras optional
    "PLR0917",  # positional arguments: same
    "PLW0603",  # `global`: used once, for the registry of solutions
    "E501",     # line length: the formatter handles it, long strings stay readable
    "PTH123",   # open() is clearer than Path.open() for files already held as a Path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PLR", "S"]
"scripts/**" = ["T20", "PTH"]
"src/mtah/cli.py" = ["T20", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/mtah"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests > 10 s (synthetic full-length match)",
    "realdata: needs the gated data bundle in MTAH_DATA_DIR",
]
filterwarnings = ["error::DeprecationWarning:mtah.*"]

[tool.coverage.run]
source = ["mtah"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false
